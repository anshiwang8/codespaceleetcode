[project]
name = "ingest"
version = "0.1.0"
description = "Codebase Puzzles ingest pipeline: fetch, filter, SCIP index, convert."
requires-python = ">=3.13,<3.14"
dependencies = [
    "jsonschema>=4.23",
    "protobuf>=6",
    "psycopg[binary]>=3.2",
    "pyyaml>=6",
    "tree-sitter>=0.24",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
    "typer>=0.15",
]

[project.scripts]
ingest = "ingest.cli:app"

[dependency-groups]
dev = [
    "grpcio-tools>=1.70",
    "pyright>=1.1.390",
    "pytest>=8",
    "ruff>=0.9",
    "types-jsonschema>=4.26.0.20261006",
    "types-protobuf>=6",
    "types-pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]

[tool.ruff]
line-length = 100
extend-exclude = ["src/ingest/proto/scip_pb2.py", "src/ingest/proto/scip_pb2.pyi", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = ["src/ingest/proto/scip_pb2.py", "src/ingest/proto/scip_pb2.pyi", "tests/fixtures"]
ignore = ["src/ingest/proto/scip_pb2.py", "src/ingest/proto/scip_pb2.pyi"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
