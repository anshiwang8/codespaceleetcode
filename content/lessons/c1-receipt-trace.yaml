slug: c1-receipt-trace
code: C1
kind: checkpoint
revision: 1
title: Receipt trace
minutes: 8
summary: Predict a receipt function by hand, and explain the one input that changes its branch.
objective: Trace a loop, a branch and a return by hand, without running the code.
prerequisites: [types-and-failure-paths]
scenario: |
  Three short items about one function. Each has one accepted answer and can be retried. After a
  miss, the review link names the lesson to revisit. Three out of three is a sign you're ready for
  the next group, not a gate: nothing is locked.
code_blocks:
  - id: receipt
    lang: js
    source: |
      function receipt(prices) {
        let total = 0;
        for (const price of prices) {
          if (price > 0) total += price;
        }
        return total >= 10 ? total - 2 : total;
      }
      const due = receipt([4, 0, 6]);
exercises:
  - id: branch
    role: required
    label: 1. Branch
    kind: choice
    prompt: When the loop reaches the price of 0, what happens to `total`?
    choices:
      - { id: increases, label: It increases }
      - { id: unchanged, label: It stays unchanged }
      - { id: resets, label: It resets to 0 }
    review: branches-and-comparisons
    key:
      answer: unchanged
      explanation: "`0 > 0` is false, so the guard skips the update and `total` stays as it was."
  - id: state
    role: required
    label: 2. State
    kind: choice
    prompt: Which list gives `total` after each iteration, in order?
    choices:
      - { id: four-four-ten, label: "4, 4, 10" }
      - { id: four-zero-six, label: "4, 0, 6" }
      - { id: four-four-eight, label: "4, 4, 8" }
    review: loops-and-running-state
    key:
      answer: four-four-ten
      explanation: "4, then 4 (the 0 is skipped), then 10. The discount on line 6 hasn't happened yet: it runs after the loop."
  - id: return
    role: required
    label: 3. Return
    kind: choice
    prompt: What value does `due` receive?
    choices:
      - { id: "8", label: "8" }
      - { id: "10", label: "10" }
      - { id: "12", label: "12" }
    review: calls-and-returns
    key:
      answer: "8"
      explanation: "The total reaches 10, which meets the inclusive `>= 10` threshold, so the caller gets `10 - 2`, which is 8."
after: |
  After each group, do its checkpoint in one sitting and revisit one missed item the next day.
  Then try a puzzle in a repository you haven't read yet.
