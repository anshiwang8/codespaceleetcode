slug: collections-and-mutation
code: L05
kind: lesson
revision: 1
title: Collections and mutation
minutes: 16
summary: Read an array index or object key, and predict whether a change shows through two names.
objective: Read an array index or object key and predict whether a change is visible through two names.
prerequisites: [calls-and-returns]
teach: |
  An **array** is an ordered collection, indexed from zero in JavaScript and Python. An **object**
  (a dictionary in Python) associates keys with values.

  Two names can refer to the *same* collection. Updating a property changes the object itself, so
  every name that refers to it sees the change. Assigning a new object to one name doesn't change
  the other. In JavaScript, `const` stops a name being rebound, but it doesn't freeze the object.
code_blocks:
  - id: example
    lang: js
    source: |
      const cart = { counts: [1, 4] };
      const alias = cart;
      alias.counts[0] = 2;
      const copy = { ...cart, counts: [...cart.counts] };
      copy.counts[0] = 9;
example:
  prompt: Draw an arrow from each name to the object it refers to, then predict what each update changes.
  blocks: [example]
  walkthrough: |
    Line 2 points `alias` at the original cart, so line 3 sets the original's first count to 2.
    Line 4 makes `copy` a separate top-level object **and** a separate `counts` array, because both
    were copied. Line 5 changes only the copy's array.
exercises:
  - id: guided
    role: practice
    label: Guided practice
    kind: choice
    prompt: After all five lines run, what is `cart.counts[0]`?
    choices:
      - { id: "1", label: "1" }
      - { id: "2", label: "2" }
      - { id: "9", label: "9" }
    key:
      answer: "2"
      explanation: "`alias` shares the original cart, so line 3 changed it to 2. `copy` has its own array, so line 5 doesn't reach the cart."
      hints:
        - Draw an arrow from each binding to its object.
      feedback:
        "1": "Line 3 writes through `alias`, which refers to the same object as `cart`."
        "9": "Line 4 copies the `counts` array too, so line 5 changes the copy's array only."
  - id: exit
    role: required
    label: Exit check
    kind: choice
    prompt: "If line 4 instead reads `const copy = { ...cart };`, what is `cart.counts[0]` after line 5?"
    choices:
      - { id: "1", label: "1" }
      - { id: "2", label: "2" }
      - { id: "9", label: "9" }
    key:
      answer: "9"
      explanation: "A top-level spread copies the object but not the nested array, so `copy.counts` and `cart.counts` are the same array, and line 5 sets it to 9."
mistake: |
  Treating spread (`...`) as a deep clone. For each property, ask which object it refers to.
next: In the next lesson, trace what happens when the data isn't the type the code expects.
references: [R5, R6]
