# The Learn path: its groups, modules and the order of every lesson, checkpoint and capstone.
# This file is the single source of ordering. Each lesson lives in content/lessons/<slug>.yaml.
# After any change here or in a lesson, run `uv run python -m ingest learn` (from ingest/) to
# regenerate web/lib/learn/course.generated.ts and web/lib/server/learn/keys.generated.ts;
# `pnpm validate` fails while they're out of date. See docs/learn-authoring.md.

title: A course in reading real software
summary: >-
  From your first line of code to an evidence-based explanation of a real system. Read small,
  original examples, predict what they do, check yourself, then practice on real repositories.

groups:
  - id: read-a-small-program
    title: Read a small program
    summary: Values, branches, loops, calls, collections and failure paths, traced by hand.
    modules:
      - id: values-and-control-flow
        title: Values and control flow
        summary: Follow a value through assignments, branches and loops.
        lessons: [values-and-assignments, branches-and-comparisons, loops-and-running-state]
      - id: functions-and-data
        title: Functions and data
        summary: Calls and returns, shared collections, and the difference between a type and a check.
        lessons: [calls-and-returns, collections-and-mutation, types-and-failure-paths]
    checkpoint: c1-receipt-trace

  - id: navigate-a-repository
    title: Navigate a repository
    summary: Find the right file, follow a name to its definition, and trace calls across files.
    modules:
      - id: evidence-and-navigation
        title: Evidence and navigation
        summary: Repository maps, pinned snapshots, symbol navigation, tests and defaults.
        lessons: [repository-maps-and-snapshots, search-and-symbol-navigation, tests-and-configuration]
      - id: tracing-across-files
        title: Tracing across files
        summary: Call chains with a stop rule, callbacks and async order, and dispatch.
        lessons: [call-chains-and-trace-boundaries, callbacks-and-async-order, interfaces-and-dispatch]
    checkpoint: c2-small-repository-investigation

  - id: follow-a-web-request
    title: Follow a web request
    summary: Routing, middleware, validation, clients, retries and the line between identity and permission.
    modules:
      - id: inside-the-server
        title: Inside the server
        summary: How a request reaches a handler, what wraps it, and where input is checked.
        lessons: [http-and-routing, middleware-and-error-paths, input-validation-and-dependencies]
      - id: across-a-network-boundary
        title: Across a network boundary
        summary: Redirects, timeouts, retries, and the checks that guard a resource.
        lessons: [clients-and-redirects, timeouts-and-retries, authentication-and-authorization]
    checkpoint: c3-request-and-client-decisions

  - id: reason-about-systems
    title: Reason about systems
    summary: State, reactivity, streams, caches and compilers, ending in an investigation of your own.
    modules:
      - id: state-and-events
        title: State and events
        summary: Reducers, reactive dependencies, and streams with subscriptions.
        lessons: [actions-and-reducers, reactive-dependencies, streams-and-subscriptions]
      - id: mechanisms-and-trade-offs
        title: Mechanisms and trade-offs
        summary: Caches, parsers and code generators, then the capstone investigation.
        lessons: [caches-and-storage, parsing-and-code-generation, codebase-investigation-capstone]
    # C4 comes before the capstone in the course, so it's placed after its module's second lesson.
    checkpoint: c4-state-and-freshness
    checkpoint_before: codebase-investigation-capstone

