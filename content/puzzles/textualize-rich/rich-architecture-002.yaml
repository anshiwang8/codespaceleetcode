title: Leaving a buffer context
prompt: |
  A Console collects Segments in a buffer and only writes them out when the outermost
  buffer context is left: `Console._exit_buffer` lowers the nesting counter and then checks
  whether the buffer should be flushed. In the non-test source under rich/, select all 3
  methods whose bodies call `Console._exit_buffer` directly. Select methods.
answer:
  kind: set
  ids:
    - rich/console.py#Console.__exit__
    - rich/console.py#Console.end_capture
    - rich/console.py#PagerContext.__exit__
hints:
  - "Buffer depth goes up and down in matched pairs, so each caller of `Console._exit_buffer` has a partner that calls `_enter_buffer`."
  - "One of them belongs to a class other than `Console`, and reaches the console through a stored `self._console` attribute rather than through `self`."
  - "Search `rich/` for `_exit_buffer(` and skip its definition; a context manager whose exit only calls another `Console` method, which then leaves the buffer, is not a direct caller."
