id: jinja-design-001
snapshot: pallets-jinja@5ef7011
type: design
difficulty: easy
title: Reading a key in an LRU cache
prompt: |
  Interview question: design a least-recently-used (LRU) cache with a fixed
  capacity, where reading a key makes it the most recently used one.

  Jinja keeps loaded templates in such a cache, `LRUCache` in src/jinja2/utils.py.
  Its `__getitem__` is called for a key that is in the cache but is not the most
  recently used one. With n keys in the cache, what does that call cost, and why?
  Select one option.
answer:
  kind: choice
  option: b
choices:
  - id: a
    label: "O(1): the deque moves the key to its right end in constant time."
  - id: b
    label: "O(n): the key is found and removed from the deque by a linear scan, then appended at the right end."
  - id: c
    label: "O(log n): the deque is kept sorted by last access time, so the key is found by binary search."
  - id: d
    label: "O(1) amortized: the key is appended again, and its stale earlier entry is skipped later, when the cache evicts."
hints:
  - "An LRU cache pairs a dict for lookup with something that records recency order; the cost of a read depends on how that order is updated when the key moves."
  - "Read `LRUCache.__getitem__` and list what it does to `self._queue` when the key isn't already at the right end; the lock and the dict lookup cost constant time."
  - "`_postinit` gives some of the deque's methods short private names. Match each name that `__getitem__` uses to the deque method it stands for, then ask what that method has to do to find a key."
