title: Stripping whitespace before a tag
prompt: |
  In Jinja, writing a minus sign on an opening delimiter, as in `{%- if x %}`,
  removes all whitespace (including newlines) between the preceding text and the
  tag. In Lexer.tokeniter in src/jinja2/lexer.py, select the lines of the single
  `if` branch that performs this removal: from its `if` line through the last
  line of its body. Do not include the `elif` branch that follows it.
