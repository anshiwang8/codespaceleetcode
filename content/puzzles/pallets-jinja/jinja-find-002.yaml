type: find
difficulty: medium
title: Stripping whitespace before a tag
prompt: |
  In Jinja, writing a minus sign on an opening delimiter, as in `{%- if x %}`,
  removes all whitespace (including newlines) between the preceding text and the
  tag. In Lexer.tokeniter in src/jinja2/lexer.py, select the lines of the single
  `if` branch that performs this removal: from its `if` line through the last
  line of its body. Do not include the `elif` branch that follows it.
answer:
  kind: location
  path: src/jinja2/lexer.py
  anchor: [736, 740]
  window: [733, 741]
hints:
  - "Whitespace control happens while the lexer splits the source into tokens: the text before a tag and the tag come from one regex match, so the stripping edits that match's groups."
  - "The lexer looks at which whitespace-control character was captured next to the opening delimiter."
  - "Inside `tokeniter`, find the branch for rules of type `OptionalLStrip` and the variable holding the captured sign; the `if` you want tests it for the minus sign, before the `elif` for `lstrip_blocks`."
