difficulty: medium
title: Where the built-in filters are listed
prompt: |
  Environment.__init__ in src/jinja2/environment.py fills `self.filters` by
  copying a dictionary that maps every built-in filter name (such as "upper" or
  "join") to the function that implements it. Within src/jinja2/, select the file
  where that dictionary literal is actually written out, entry by entry. Select a
  file.
answer:
  kind: file
  path: src/jinja2/filters.py
  accept: []
  accept_reasons: []
hints:
  - "Packages often re-export a value under a new name from a small module of defaults, so the module that imports a name is not necessarily the one that defines it."
  - "Follow the import of the name that `Environment.__init__` copies, and keep following it if it is itself imported."
  - "The first import leads to `src/jinja2/defaults.py`, which only re-imports the name under an alias with `as`; follow that import one more step and confirm the dict literal is there."
