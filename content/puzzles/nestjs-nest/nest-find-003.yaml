type: find
difficulty: medium
title: Who makes the module token
prompt: |
  An application is created with `NestFactory.create(AppModule)` and no options. When
  `NestContainer.addModule` in packages/core/injector/container.ts registers a module, the
  token that keys the module in the container comes from a method call on a factory object.
  Select the file that defines the class of the factory object used in this configuration:
  the class whose method builds the token string, not a class that only asks for the
  token, and not the interface it implements. Select a file.
answer:
  kind: file
  path: packages/core/injector/opaque-key-factory/by-reference-module-opaque-key-factory.ts
  accept: []
  accept_reasons: []
hints:
  - "Follow the token back from `addModule`: it is produced when the module is compiled, and the compiler only asks another object to build it."
  - "The object that computes the token is chosen once, when the container itself is constructed."
  - "In the `NestContainer` constructor, work out which side of the `moduleIdGeneratorAlgorithm` ternary runs when `NestFactory.create` passes no options, then open that class's definition."
