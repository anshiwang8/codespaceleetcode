type: find
difficulty: easy
title: Where a circular import is reported
prompt: |
  In packages/core/scanner.ts, `reflectImports` hands each entry of a module's
  `imports` metadata to one method, and that method refuses an entry that is
  `undefined`. Select the method. Select a function.
answer:
  kind: symbol
  id: packages/core/scanner.ts#DependenciesScanner.insertImport
  accept: []
  accept_reasons: []
hints:
  - "The module scanner registers a module's `imports` entries one by one."
  - "Other scanner methods also reject `undefined` entries, such as `scanForModules` with `UndefinedModuleException`. The one you want throws a different exception, imported at the top of scanner.ts."
  - "In `reflectImports`, follow the call inside the `for` loop over the collected `modules` to its definition, and check that its first statement throws when the entry is `undefined`."
