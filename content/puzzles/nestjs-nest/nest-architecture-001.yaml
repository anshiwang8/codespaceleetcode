id: nest-architecture-001
snapshot: nestjs-nest@8d9dd9d
type: architecture
difficulty: medium
title: Who actually invokes guards, interceptors and pipes
prompt: |
  In the non-test source under packages/core/, select all 3 files that call the
  user-supplied enhancer instance itself: a guard's `canActivate`, an interceptor's
  `intercept` on the interceptor object, and a pipe's `transform`. Files that only call
  another Nest class which does this on their behalf do not count.
answer:
  kind: set
  ids:
    - packages/core/guards/guards-consumer.ts
    - packages/core/interceptors/interceptors-consumer.ts
    - packages/core/pipes/pipes-consumer.ts
hints:
  - "The classes that look up which enhancers apply are separate from the ones that run them."
  - "Look in the folder for each enhancer type under packages/core/. Orchestrators such as `router/router-execution-context.ts` call `intercept` on a Nest-owned object, not on the user's interceptor."
  - "Search packages/core/ for `.canActivate(`, `.intercept(` and `.transform(`, and keep only hits whose receiver is a user's guard, interceptor or pipe instance, not a Nest class held on `this` or an options object."
solution: solutions/nest-architecture-001.md
tags: [middleware, request-lifecycle]
authors: [agent-author-1]
verified_by: [agent:blind-1]
