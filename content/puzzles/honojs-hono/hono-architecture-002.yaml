id: hono-architecture-002
snapshot: honojs-hono@17ad0e2
type: architecture
difficulty: easy
title: Routers that can ask SmartRouter to fall back
prompt: |
  `SmartRouter` skips to its next candidate when a router raises `UnsupportedPathError`.
  Among the non-test source files under src/router/, select all 3 files that contain a
  `throw` of `UnsupportedPathError` (the file that merely declares the error class does not
  count, and neither does a file that only catches it).
answer:
  kind: set
  ids:
    - src/router/linear-router/router.ts
    - src/router/pattern-router/router.ts
    - src/router/reg-exp-router/router.ts
hints:
  - "Start from the declaration of the `UnsupportedPathError` class, find its references under `src/router/`, and sort them into imports, `instanceof` checks and real throws."
  - "Rule out the `catch` in `SmartRouter.match` and any test files. A throw can also build the error inside a conditional expression rather than as a plain `throw new`."
  - "Each router class is defined in its own directory under `src/router/`. Read the whole class file in each, since a router can throw from `match` as well as from `add` or a private helper."
solution: solutions/hono-architecture-002.md
tags: [routing, errors]
