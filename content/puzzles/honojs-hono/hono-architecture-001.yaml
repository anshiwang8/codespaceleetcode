type: architecture
difficulty: hard
title: Where the default app ends up after a fallback
prompt: |
  An app is created with the Hono class from src/hono.ts with no options, and its only
  route is registered as `app.get('/files/:path{.*}', handler)`. Read how `SmartRouter` in
  src/router/smart-router/ and the routers it is given in src/router/ treat that path.
  Once the first request has been matched, which class's `match` implementation serves
  every later request?
answer:
  kind: choice
  option: d
choices:
  - id: a
    label: RegExpRouter
  - id: b
    label: SmartRouter's own match method, which keeps trying each router on every request
  - id: c
    label: LinearRouter
  - id: d
    label: TrieRouter
  - id: e
    label: PatternRouter
hints:
  - Look for where a path pattern can make a router throw during `add`, and what `SmartRouter.match` does about it.
