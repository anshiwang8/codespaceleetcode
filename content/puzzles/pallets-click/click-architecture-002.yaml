id: click-architecture-002
snapshot: pallets-click@2247b35
type: architecture
difficulty: medium
title: Control-flow exceptions outside ClickException
prompt: |
  In src/click/exceptions.py, most exception classes derive, directly or through
  another class in the file, from ClickException. Select all 2 classes in that
  file that do not derive from ClickException (ClickException itself is not one
  of the answers).
answer:
  kind: set
  ids:
    - src/click/exceptions.py#Abort
    - src/click/exceptions.py#Exit
hints:
  - "Not every exception in Click reports a user-facing error: some exist only to end a run early, and those don't need `ClickException`'s message formatting."
  - "Each class's bases are on its `class` line; follow each base up through the file until you reach either `ClickException` or a built-in exception type."
  - "`Command.main` has separate except clauses for these two, apart from the one for `ClickException`."
