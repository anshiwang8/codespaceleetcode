title: Ordering parameters for processing
prompt: |
  In src/click/core.py, select the module-level function that decides the order
  in which a command's declared parameters get processed. It sorts them so that
  eager parameters come first, and within each group the parameters the user
  actually passed come in the order they appeared on the command line, ahead of
  those that were not passed. Select a function.
answer:
  kind: symbol
