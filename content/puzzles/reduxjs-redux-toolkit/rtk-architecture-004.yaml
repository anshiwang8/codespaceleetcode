type: architecture
difficulty: hard
title: A slice reducer and extraReducers on one type
prompt: |
  In packages/toolkit/src/, a slice is created with:

  ```ts
  createSlice({
    name: 'counter',
    initialState: { value: 0 },
    reducers: { added(state) { state.value += 1 } },
    extraReducers: (builder) => {
      builder
        .addCase('counter/added', (state) => { state.value += 10 })
        .addMatcher((action) => action.type.endsWith('/added'), (state) => { state.value *= 2 })
        .addDefaultCase((state) => { state.value = -1 })
    },
  })
  ```

  The slice's `reducer` is then called with the state `{ value: 0 }` and the action
  `{ type: 'counter/added' }`. Following the code from `createSlice` in createSlice.ts,
  what is `value` in the state it returns? Select one option.
answer:
  kind: choice
  option: d
choices:
  - id: a
    label: "20"
  - id: b
    label: "1"
  - id: c
    label: "22"
  - id: d
    label: "2"
hints:
  - "The slice's reducer is assembled from two sources of case reducers before it ever runs, so the result depends on how they're merged and on which reducers run for a single action."
  - "Look at how `buildReducer` in createSlice.ts combines the slice's own case reducers with the ones from `extraReducers` before calling `createReducer`."
  - "Check the order of the two spreads in `finalCaseReducers`, then read `reducer` inside createReducer.ts: which reducers it collects for `action.type`, when it falls back to the default case, and in what order it applies them."
