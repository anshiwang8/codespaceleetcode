title: Default middleware order
prompt: |
  In packages/toolkit/src/getDefaultMiddleware.ts, `getDefaultMiddleware()` is
  called with no options while `process.env.NODE_ENV` is not "production".
  Following the code, which option lists the middleware in the returned array
  in order, from index 0 (the first one in the array) onward? Select one
  option.
answer:
  kind: choice
  option: a
choices:
  - id: a
    label: action-creator check, immutable-state check, thunk, serializable-state check
  - id: b
    label: immutable-state check, thunk, serializable-state check, action-creator check
  - id: c
    label: thunk, immutable-state check, serializable-state check, action-creator check
  - id: d
    label: action-creator check, thunk, immutable-state check, serializable-state check
hints:
  - "Treat the function as building the array one statement at a time: the order the blocks appear in the source isn't necessarily the order of the result."
  - "In `getDefaultMiddleware`, find the blocks guarded by `thunk`, `immutableCheck`, `serializableCheck` and `actionCreatorCheck`, and note which sit inside the `NODE_ENV` check. The array's class doesn't override `push` or `unshift`."
  - "Pay attention to whether each one is added with `push` or `unshift`, and write down the whole array after each statement, in source order."
