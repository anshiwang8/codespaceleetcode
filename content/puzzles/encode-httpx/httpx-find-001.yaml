type: find
difficulty: easy
title: Changing the method on redirect
prompt: |
  In httpx/_client.py, select the BaseClient method that decides which HTTP
  method the follow-up request should use after a redirect response, for example
  turning a POST into a GET for certain status codes. Select a method.
answer:
  kind: symbol
  id: httpx/_client.py#BaseClient._redirect_method
  accept: []
  accept_reasons: []
hints:
  - It is one of several small `BaseClient` helpers that are combined to build the follow-up request after a redirect, one helper for each part of the new request.
  - Those helpers sit together in `BaseClient`, just before `_set_timeout`. Skip the one that reads the `Location` header; it only works out the URL.
  - Open the method that assembles the redirect request and see which helper fills its `method` variable; that helper compares `response.status_code` with `codes` constants.
