id: httpx-architecture-001
snapshot: encode-httpx@b5addb6
type: architecture
difficulty: easy
title: Synchronous transport implementations
prompt: |
  httpx separates sync and async transports by two base classes in
  httpx/_transports/base.py. Within the httpx/_transports/ directory, select all 3
  concrete transport classes that have the synchronous base class BaseTransport
  among their bases. Do not select stream or response helper classes.
answer:
  kind: set
  ids:
    - httpx/_transports/default.py#HTTPTransport
    - httpx/_transports/wsgi.py#WSGITransport
    - httpx/_transports/mock.py#MockTransport
hints:
  - "Transports are an extension point defined by inheritance: what counts is whether `BaseTransport` appears among a class's own bases, whatever the class is called."
  - Skip `base.py` itself and the classes that subclass `SyncByteStream` or `AsyncByteStream`; those are the stream helpers the prompt excludes.
  - Find references to `BaseTransport` and keep only those in `class` headers. One of them supports both the sync and the async interface.
solution: solutions/httpx-architecture-001.md
tags: [http-clients, extension-points]
authors: [agent-author-3]
verified_by: [agent:blind-3]
