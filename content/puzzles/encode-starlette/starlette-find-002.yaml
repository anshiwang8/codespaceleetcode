title: Building the trailing-slash redirect path
prompt: |
  In Router.app in starlette/routing.py, when no route matched an HTTP request
  fully or partially and slash redirects are enabled, the router builds a copy
  of the scope with an alternate path and checks whether any route would match
  that instead. Select the lines of the `if`/`else` statement that computes the
  alternate path, from its `if` line through the last line of its `else` body.
answer:
