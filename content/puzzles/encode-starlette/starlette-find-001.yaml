title: The path a route is matched against
prompt: |
  Route.matches in starlette/routing.py does not run its path regex against
  `scope["path"]` directly. It first computes a path that has the ASGI
  `root_path` prefix removed, so that an app mounted under a prefix still matches
  its own routes. Select the function that computes that path.
answer:
  kind: symbol
  id: starlette/_utils.py#get_route_path
  accept: []
  accept_reasons: []
hints:
  - "ASGI servers report a mount prefix separately as `root_path`, so trimming it is a shared job: every route type needs the same prefix-free path before matching."
  - The same helper is also called from `Mount.matches`, `WebSocketRoute.matches`, `Router.app` and `StaticFiles`, so it is defined outside `starlette/routing.py`.
  - Look at the first line of the http branch of `Route.matches`, then jump to the definition of the function it calls.
