id: starlette-architecture-002
snapshot: encode-starlette@0f08970
type: architecture
difficulty: easy
title: Where body size limits are applied
prompt: |
  A maximum request body size can be configured at several levels of a
  Starlette app, and each level enforces it by wrapping an ASGI app in
  RequestBodyLimitMiddleware from starlette/middleware/body_limit.py. Within
  starlette/routing.py and starlette/applications.py, select all 4 methods whose
  own body puts RequestBodyLimitMiddleware around an app when a max_body_size is
  given, either by constructing it directly or by adding it to a middleware list
  that the same method then builds. Select the methods, not the classes that own
  them.
answer:
  kind: set
  ids:
    - starlette/applications.py#Starlette.build_middleware_stack
    - starlette/routing.py#Route.__init__
    - starlette/routing.py#Mount.__init__
    - starlette/routing.py#Router.__init__
hints:
  - Each level that accepts `max_body_size` enforces it on the ASGI app it owns. Look for where the limit is actually applied, not just where the argument is accepted.
  - Find references on `RequestBodyLimitMiddleware`, and ignore the tests.
  - Group the references by the method that contains them. In `starlette/applications.py` the constructor only stores the limit; the wrapping happens in the method that assembles the `Middleware` list.
