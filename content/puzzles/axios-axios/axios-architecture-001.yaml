id: axios-architecture-001
snapshot: axios-axios@fb88a1b
type: architecture
difficulty: hard
title: Interceptor running order
prompt: |
  Using the default axios instance (default `transitional` settings), this
  code registers three request interceptors and two response interceptors,
  then makes a request:

  ```js
  axios.interceptors.request.use(A);
  axios.interceptors.request.use(B, null, { runWhen: () => false });
  axios.interceptors.request.use(C);
  axios.interceptors.response.use(D);
  axios.interceptors.response.use(E);
  await axios.get('https://example.com/');
  ```

  Following `Axios._request` in lib/core/Axios.js and the defaults it reads,
  in what order do the interceptors and `dispatchRequest` run? Select one
  option.
answer:
  kind: choice
  option: d
choices:
  - id: a
    label: A, C, dispatchRequest, D, E
  - id: b
    label: C, B, A, dispatchRequest, D, E
  - id: c
    label: A, C, dispatchRequest, E, D
  - id: d
    label: C, A, dispatchRequest, D, E
  - id: e
    label: C, A, dispatchRequest, E, D
hints:
  - "Think about how `_request` turns the registered interceptors into one chain around `dispatchRequest`: which ones get filtered out, and whether each list keeps registration order."
  - "Look at the two `forEach` callbacks in `_request` that fill `requestInterceptorChain` and `responseInterceptorChain`, and at how each one adds an interceptor to its array."
  - "Check the default value of every transitional flag that `_request` reads while it builds the request chain; `transitionalDefaults` comes from `lib/defaults/transitional.js`."
