id: axios-architecture-003
snapshot: axios-axios@fb88a1b
type: architecture
difficulty: easy
title: Naming a new adapter
prompt: |
  A request config can name its adapter with a string, such as
  `adapter: 'fetch'`, and the request fails if axios does not know the name.
  You want a new adapter to be selectable by its own name. In lib/, select the file that defines the table mapping adapter names
  to adapters (not the file that sets the default adapter order). Select a
  file.
answer:
  kind: file
  path: lib/adapters/adapters.js
  accept: []
  accept_reasons: []
hints:
  - "A string name becomes an adapter only through a table keyed by name, so follow where a string `config.adapter` is resolved rather than where each adapter is implemented."
  - "The function that dispatches the request does not resolve the name itself; it hands it to a helper."
  - "Follow that helper's import to its module and find the object it indexes with the lowercased name. Ignore `lib/defaults/`, which only lists the names in their default order."
solution: solutions/axios-architecture-003.md
