id: axios-architecture-002
snapshot: axios-axios@fb88a1b
type: architecture
difficulty: medium
title: Where cancellation errors are born
prompt: |
  In lib/, exactly 5 files contain an expression `new CanceledError(...)`
  (a file that only imports or re-exports `CanceledError` does not count, and
  neither does the file that defines the class). Select all 5 files.
answer:
  kind: set
  ids:
    - lib/adapters/http.js
    - lib/adapters/xhr.js
    - lib/cancel/CancelToken.js
    - lib/core/dispatchRequest.js
    - lib/helpers/composeSignals.js
hints:
  - "Cancellation errors are created wherever axios notices an abort or a canceled token, and that happens in several layers of the library, not in one subsystem."
  - "Find All References on the `CanceledError` class, then discard the import lines."
  - "Also drop the file that defines the class and the entry file that only attaches it to the exported `axios` object. A remaining file counts once even when it constructs the error in more than one place."
