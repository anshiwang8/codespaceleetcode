title: Runaway reaction cycle guard
prompt: |
  In packages/mobx/src/core/reaction.ts, the helper that drains the queue of
  pending reactions loops while there are reactions left, because running a
  reaction can queue more. Select the lines of the `if` statement inside that
  loop that protects against reactions which keep re-triggering each other
  forever: from the `if` line through its closing brace. It logs an error and
  discards the queued reactions.
