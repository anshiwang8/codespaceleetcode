title: From a value write to running reactions
prompt: |
  Starting at the `set` method of `ObservableValue` in
  packages/mobx/src/types/observablevalue.ts, list the chain of functions, in call order, where each one calls the next, until the call to `runReactions` (in packages/mobx/src/core/reaction.ts) made
  when the global batch counter reaches zero. List direct calls only (each function must be called literally in the
  body of the previous one), and skip standard-library and third-party calls.

  Assume the new value differs from the old one, no interceptors or change
  listeners are registered, and the write happens outside any action,
  transaction or batch, so the global batch counter drops back to zero. Include
  the start function in your sequence.
answer:
