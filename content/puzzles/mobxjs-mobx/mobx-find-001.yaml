title: Diffing a derivation's dependencies
prompt: |
  In packages/mobx/src/core/, a derivation (a reaction or a computed value)
  records which observables it read while its function ran. Select the
  function that then compares that new list with the derivation's previous
  list, registers the derivation as an observer of observables it read for the
  first time, and unregisters it from observables it no longer reads. Select
  a function (the one that performs the comparison, not the one that runs the
  derivation's function).
