difficulty: easy
title: Who constructs a Reaction
prompt: |
  In the packages/*/src/ directories (ignore tests, docs and examples),
  exactly 4 functions contain a `new Reaction(...)` expression: two in the core
  mobx package and one in each of the two React bindings, mobx-react and
  mobx-react-lite. Select all 4 functions.
answer:
  kind: set
  ids:
    - packages/mobx/src/api/autorun.ts#autorun
    - packages/mobx/src/api/autorun.ts#reaction
    - packages/mobx-react/src/observerClass.ts#createReaction
    - packages/mobx-react-lite/src/useObserver.ts#createReaction
hints:
  - "Search for the constructor expression itself, `new Reaction(`, rather than for imports of `Reaction`, and leave out tests."
  - "Map each hit to the named function that encloses it. In the core package the hits are under `packages/mobx/src/api/`, and one function there contains more than one hit."
  - "Two of the four functions have the same name but live in different packages. In the React bindings each hit is in a small helper, not in exported functions like `useObserver` or `makeClassComponentObserver`."
