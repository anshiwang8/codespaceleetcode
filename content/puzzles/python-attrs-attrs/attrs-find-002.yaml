id: attrs-find-002
snapshot: python-attrs-attrs@9d9f94a
type: find
difficulty: medium
title: Skipping a hook nobody needs
prompt: |
  A mutable class decorated with `define` gets a class-level on_setattr hook that converts
  and validates on assignment. In `_ClassBuilder.__init__` in src/attr/_make.py, the builder
  can decide that this hook is pointless because no field has anything for it to do, and
  switch it off. Select the lines of the single `if` statement that makes that decision,
  from the `if` line (including its multi-line condition) through the line that switches the
  hook off.
answer:
  kind: location
  path: src/attr/_make.py
  anchor: [745, 756]
  window: [731, 758]
hints:
  - "The hook is only worth keeping if some field gives it work, so think about which per-field settings the default hook and its validate-only and convert-only variants use."
  - "The decision sits in the `elif` after the frozen branch of `_ClassBuilder.__init__`, which runs only for the default hook, `setters.validate` or `setters.convert`."
  - "Just before this statement, a loop over the fields records whether any of them has a validator or a converter. The `if` you want tests those two flags against each kind of hook."
