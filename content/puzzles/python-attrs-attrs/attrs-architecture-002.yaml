id: attrs-architecture-002
snapshot: python-attrs-attrs@9d9f94a
type: architecture
difficulty: medium
title: Methods compiled in one pass
prompt: |
  `_ClassBuilder` in src/attr/_make.py attaches dunder methods to a class in two different
  ways. Some are ordinary Python functions or closures put straight into the class
  namespace. Others are generated as source code that is queued on the builder and
  compiled later, together, in a single pass when the class is built. Select all 5 methods
  of `_ClassBuilder` whose bodies queue generated source for that pass. Select methods.
answer:
  kind: set
  ids:
    - src/attr/_make.py#_ClassBuilder.add_repr
    - src/attr/_make.py#_ClassBuilder.add_hash
    - src/attr/_make.py#_ClassBuilder.add_init
    - src/attr/_make.py#_ClassBuilder.add_attrs_init
    - src/attr/_make.py#_ClassBuilder.add_eq
hints:
  - "Compare the two styles: a function assigned straight into `self._cls_dict`, versus a script string and a hook stored for later. Only the second style counts."
  - "The queue is set up in `_ClassBuilder.__init__` as a list of `(script, globs, hook)` tuples; note its attribute name."
  - "Find the method that compiles the queue, then find every place the queue is appended to and note the `_ClassBuilder` method each append sits in."
