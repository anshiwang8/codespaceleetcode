title: What a frozen class does on assignment
prompt: |
  When a class is built with `frozen=True`, the class builder in src/attr/_make.py puts a
  replacement `__setattr__` into the class's namespace, so that assigning to an attribute of
  an instance raises an error. Select the function that is installed as that `__setattr__`
  (not the one installed as `__delattr__`). Select a function.
answer:
  kind: symbol
  id: src/attr/_make.py#_frozen_setattrs
  accept: []
  accept_reasons: []
hints:
  - "Immutability is enforced by swapping the class's attribute-assignment hook, so look for where the builder writes into the namespace dict it prepares, not for a method on the class."
  - "Search `src/attr/_make.py` for `\"__setattr__\"` used as a key of `self._cls_dict`; skip the write that wraps on_setattr hooks for mutable classes."
  - "Look in `_ClassBuilder.__init__` for the branch that runs when the class properties say it is frozen."
