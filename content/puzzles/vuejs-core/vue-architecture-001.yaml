id: vue-architecture-001
snapshot: vuejs-core@24c9d0b
type: architecture
difficulty: easy
title: Directive transforms in the base compiler preset
prompt: |
  `getBaseTransformPreset` in packages/compiler-core/src/compile.ts returns two things: a
  list of node transforms and a record of directive transforms keyed by directive name.
  Select all 3 files, all under packages/compiler-core/src/transforms/, that define the
  functions registered in that directive-transform record.
answer:
  kind: set
  ids:
    - packages/compiler-core/src/transforms/vBind.ts
    - packages/compiler-core/src/transforms/vModel.ts
    - packages/compiler-core/src/transforms/vOn.ts
hints:
  - "Node transforms run on every AST node, but directive transforms are looked up by directive name when an element's directives are processed. Only the keyed record matters here."
  - "Open `getBaseTransformPreset` and compare the `TransformPreset` type with the value it returns. Some node transforms have names that mention a directive, and those don't count."
  - "The record is the second element of the returned array. Follow each value's import, or jump to its definition, rather than guessing the file from the value's name."
