title: Deferring a notified effect
prompt: |
  In packages/reactivity/src/effect.ts, `ReactiveEffect.notify` does not run the effect.
  Unless the effect is already marked as notified, it hands the effect to a module-level
  function in the same file, which marks it as notified and chains it onto a pending list
  to be run later. Select that function.
answer:
