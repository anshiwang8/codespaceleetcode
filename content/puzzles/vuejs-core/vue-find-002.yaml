title: Dropping dependencies a run did not read
prompt: |
  In packages/reactivity/src/effect.ts, `cleanupDeps` walks an effect's dependency links
  after the effect function has run. Links whose version is still -1 were not read during
  that run. Select the lines in `cleanupDeps` that unlink such a stale dependency from both
  the dep's subscriber list and the effect's own dependency list. Select the lines.
