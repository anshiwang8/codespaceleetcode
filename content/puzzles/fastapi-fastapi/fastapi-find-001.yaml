title: Validating and serializing the endpoint's return value
prompt: |
  In fastapi/routing.py, select the module-level function that takes the value an
  endpoint returned and, when a response model field is available, validates it
  against that field (raising ResponseValidationError if validation fails) and
  serializes the result. When there is no field, it falls back to
  jsonable_encoder. Select a function.
answer:
  kind: symbol
  id: fastapi/routing.py#serialize_response
  accept: []
  accept_reasons: []
hints:
  - "This is the response half of the request lifecycle: when the endpoint returns a plain value rather than a `Response`, FastAPI checks it against the response model before building a response."
  - It is called from the inner request-handling function built by `get_request_handler`.
  - In that inner `app`, follow the branch where the endpoint's return value is not a `Response`, and open the call that receives `field=response_field` and the raw return value.
