id: fastapi-architecture-003
snapshot: fastapi-fastapi@45cb225
type: architecture
difficulty: easy
title: Where the default error responses come from
prompt: |
  When a FastAPI application is created, it installs default exception handlers
  for HTTPException and for request validation errors, unless the user supplied
  handlers of their own for those exceptions. Within the fastapi/ package,
  select the file that defines those default handler functions, the ones that
  build the error responses. Select a file.
answer:
  kind: file
  path: fastapi/exception_handlers.py
  accept: []
  accept_reasons: []
hints:
  - The application only plugs default handlers into a mapping; the handler functions themselves are defined in a separate module and imported.
  - Find where the application's constructor fills in its handler dict, and follow the names it uses.
  - In `FastAPI.__init__`, the `setdefault` calls keyed by `HTTPException` and `RequestValidationError` pass functions imported at the top of the file. Jump to one's definition.
