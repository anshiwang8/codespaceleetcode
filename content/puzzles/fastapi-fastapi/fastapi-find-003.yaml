title: Swapping a dependency for its override
prompt: |
  In solve_dependencies in fastapi/dependencies/utils.py, for each sub-dependency
  the function checks whether the application has registered dependency
  overrides, and if so replaces the original callable by its override and builds a
  new Dependant for it. Select the lines of that single `if` statement, from the
  `if` line (including its multi-line condition) through its last body statement.
answer:
