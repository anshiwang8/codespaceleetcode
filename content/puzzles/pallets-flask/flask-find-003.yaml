type: find
difficulty: medium
title: Default JSON provider
prompt: |
  A Flask application exposes an attribute `json` whose value is an instance of a
  provider class that the application creates itself unless a subclass overrides
  the class used. Within src/flask/, select the file that defines that provider
  class as it is used by default (the one implementing JSON dumps and loads with
  the standard-library json module). Select a file.
answer:
  kind: file
  path: src/flask/json/provider.py
  accept: []
  accept_reasons: []
hints:
  - "Flask splits its app class into a framework-independent base and a WSGI subclass, so the attribute may be set up in the base class rather than in `src/flask/app.py`."
  - "Find where the app builds its `json` attribute, then follow the class it instantiates."
  - "`self.json` is created from a class attribute on `App` in `src/flask/sansio/app.py`; that attribute's default is imported at the top of that file, and the relative import names the module."
