id: flask-architecture-001
snapshot: pallets-flask@49943b5
type: architecture
difficulty: easy
title: What a custom session interface must implement
prompt: |
  Flask lets an application replace how sessions are stored by assigning a
  different session interface object. In src/flask/sessions.py, the base class
  SessionInterface provides working defaults for most of its methods but leaves
  some of them unimplemented, with a body that only raises NotImplementedError.
  Select all 2 methods of SessionInterface that a replacement interface is
  therefore required to provide.
answer:
  kind: set
  ids:
    - src/flask/sessions.py#SessionInterface.open_session
    - src/flask/sessions.py#SessionInterface.save_session
hints:
  - "A pluggable interface usually splits into required hooks the framework calls on every request and optional helpers with working defaults; most helpers here just read `app.config`."
  - "Look for the methods that Flask calls at the start and at the end of a request."
  - "`SecureCookieSessionInterface`, the default subclass in the same file, overrides only a few base methods; check which of those have a base body that only raises."
