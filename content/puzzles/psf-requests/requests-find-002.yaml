title: Dropping the body on a redirect
prompt: |
  Inside SessionRedirectMixin.resolve_redirects in src/requests/sessions.py,
  a redirected request may have its body removed together with the headers that
  describe that body. This happens only when the redirect's status code is not
  one of the two codes that must preserve the method and body.
  Select the lines of the single conditional block that does this, from the `if`
  line (including its multi-line condition) through its last statement.
answer:
  kind: location
  path: src/requests/sessions.py
  anchor: [250, 258]
  window: [246, 262]
hints:
  - HTTP requires 307 and 308 redirects to repeat the method and body, while other redirects may be followed without a body. This block applies that rule.
  - Inside `resolve_redirects`, look after the new URL has been set on `prepared_request` and the method has been adjusted, for a condition built from `codes` constants.
  - Look for the `Content-Length` header being popped. Select from the `if` whose condition lists two status codes through the line that clears `prepared_request.body`.
