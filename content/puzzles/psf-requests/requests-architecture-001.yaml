title: Concrete authentication classes
prompt: |
  In src/requests/auth.py, authentication is pluggable: a callable that receives
  a PreparedRequest and returns it can be passed as `auth`. Select all 3 classes
  in that file that derive, directly or through another class in the file, from the
  base class of auth implementations (select the three derived classes, not the
  base class itself).
answer:
  kind: set
  ids:
    - src/requests/auth.py#HTTPBasicAuth
    - src/requests/auth.py#HTTPProxyAuth
    - src/requests/auth.py#HTTPDigestAuth
hints:
