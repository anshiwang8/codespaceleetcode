type: architecture
difficulty: easy
title: Concrete authentication classes
prompt: |
  In src/requests/auth.py, authentication is pluggable: a callable that receives
  a PreparedRequest and returns it can be passed as `auth`. Select all 3 classes
  in that file that derive, directly or through another class in the file, from the
  base class of auth implementations (select the three derived classes, not the
  base class itself).
answer:
  kind: set
  ids:
    - src/requests/auth.py#HTTPBasicAuth
    - src/requests/auth.py#HTTPProxyAuth
    - src/requests/auth.py#HTTPDigestAuth
hints:
  - "Auth in requests is a callable-object pattern: each scheme is a class whose `__call__` takes a `PreparedRequest` and returns it, all rooted in one base class."
  - The base class only defines a `__call__` that raises `NotImplementedError`. Find it first, then read every `class` line in `src/requests/auth.py`.
  - One of them derives from another one rather than from the base class, so a reference search on the base class alone will miss it.
