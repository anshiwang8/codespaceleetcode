title: Connection errors raised by the adapter
prompt: |
  HTTPAdapter.send in src/requests/adapters.py translates urllib3 errors into
  the exception classes defined in src/requests/exceptions.py. Consider only the
  `raise` statements written in the body of send itself (not in methods it
  calls). Of the requests exception classes those statements raise, select all 3
  that a caller's `except requests.exceptions.ConnectionError:` clause would
  catch, other than ConnectionError itself.
answer:
