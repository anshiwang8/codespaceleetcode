id: requests-architecture-003
snapshot: psf-requests@3c7baaa
type: architecture
difficulty: medium
title: Connection errors raised by the adapter
prompt: |
  HTTPAdapter.send in src/requests/adapters.py translates urllib3 errors into
  the exception classes defined in src/requests/exceptions.py. Consider only the
  `raise` statements written in the body of send itself (not in methods it
  calls). Of the requests exception classes those statements raise, select all 3
  that a caller's `except requests.exceptions.ConnectionError:` clause would
  catch, other than ConnectionError itself.
answer:
  kind: set
  ids:
    - src/requests/exceptions.py#ConnectTimeout
    - src/requests/exceptions.py#ProxyError
    - src/requests/exceptions.py#SSLError
hints:
  - "An `except` clause also catches every subclass of the class it names, so this is an inheritance question: which raised classes have `ConnectionError` among their ancestors?"
  - List each `raise` in `HTTPAdapter.send`; many sit in the `except` handlers for `MaxRetryError` and for urllib3's SSL and HTTP errors. Then look each class up in `src/requests/exceptions.py`.
  - Check every base class in each class header, not just the first one. Classes that share only `RequestException` with `ConnectionError` don't count.
