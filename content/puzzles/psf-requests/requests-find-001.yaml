title: Merging request settings with session defaults
prompt: |
  In src/requests/sessions.py, select the module-level function that combines a
  per-request setting with the corresponding session-level setting. When both are
  mappings it builds a new mapping from the session's entries overlaid with the
  request's entries, and it then removes every key whose merged value is None.
  Select a function (not a method).
answer:
  kind: symbol
  id: src/requests/sessions.py#merge_setting
  accept: []
  accept_reasons: []
hints:
  - Headers, params and other settings can be set on both the session and a single request, so one generic helper reconciles each pair, whatever the setting is.
  - The session calls this helper several times while preparing a request, once per setting it merges.
  - Only a few functions in `src/requests/sessions.py` sit outside a class. Skip the hooks-specific one, which delegates to the general helper, and look for the loop that deletes `None` values.
