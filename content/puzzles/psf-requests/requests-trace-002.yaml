title: Where proxy credentials become a header
prompt: |
  Start at HTTPAdapter.send in src/requests/adapters.py. Assume the request URL is
  routed through an HTTP proxy (not a SOCKS proxy) whose URL contains a
  username and password, and that no proxy manager for that proxy URL has been
  cached on the adapter yet. Select the chain of methods and functions, in call
  order, where each one directly calls the next, ending at the function that turns
  the username and password into the header value `Basic ...`.
  Direct calls only. Skip constructors, standard-library calls and third-party
  (urllib3) calls.
