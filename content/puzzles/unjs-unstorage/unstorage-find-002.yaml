id: unstorage-find-002
snapshot: unjs-unstorage@5781aae
type: find
difficulty: medium
title: The most specific mount wins
prompt: |
  In src/storage.ts, a storage can have two mount points that both prefix a
  key, for example `cache` and `cache:images`. A key such as
  `cache:images:logo.png` is then served by the more specific mount. The
  lookup inside `createStorage` simply returns the first mount point in
  `context.mountpoints` that the key starts with.

  Select the line that makes the more specific mount point come first in
  that list. Select the line.
answer:
  kind: location
  path: src/storage.ts
  anchor: [545, 545]
  window: [538, 556]
hints:
  - "Because the lookup stops at the first prefix match, specificity has to come from the order of `context.mountpoints` itself. Find every place that writes to that list."
  - "The order is not fixed at lookup time. Look at what happens when a driver is added."
  - "In the storage's `mount` method, follow what happens to `context.mountpoints` right after the new base is added, and pick the line that decides the order, not the `push`."
