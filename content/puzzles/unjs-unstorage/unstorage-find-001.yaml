title: Hidden metadata keys
prompt: |
  `setMeta(key, value)` stores metadata as a separate item whose key is the
  item key with a `$` appended. `storage.getKeys()` never lists those `$`
  keys. In src/ (ignore src/drivers/), select the function that removes them
  from the list `getKeys` returns. Select a function.
answer:
  kind: symbol
  id: src/utils.ts#filterKeyByBase
  accept: []
  accept_reasons: []
hints:
  - "Metadata keys are hidden when keys are listed, not when they are written, so follow the read path for key listings rather than `setMeta`."
  - "The `$` test is plain string work, so expect a small key helper that `src/storage.ts` imports from another file, next to other key utilities."
  - "Open `getKeys` in `src/storage.ts` and look at what happens to `allKeys` just before it is returned. Two helpers are used there; check which one tests the key's last character."
