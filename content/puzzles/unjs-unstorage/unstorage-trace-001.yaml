id: unstorage-trace-001
snapshot: unjs-unstorage@5781aae
type: trace
difficulty: medium
title: A Cloudflare KV binding that cannot write
prompt: |
  Starting at the `driver` factory constant in
  src/drivers/cloudflare-kv-binding.ts, list the functions called, in order,
  until the function that constructs the `Error` object that gets thrown is
  called.

  The methods of the object that `driver` returns have no symbols of their
  own, so a call made inside one of those methods counts as a call made by
  `driver`.

  Assume the returned driver's `getItem` is called, and `opts.binding` is an
  object (not a string) that has `get` and `delete` properties but no `put`.
  `opts.base` is not set.

  List direct calls only (each function must be called literally in the body
  of the previous one), and skip standard-library and third-party calls.
  Include the start symbol in your sequence.
answer:
  kind: sequence
  ids:
    - src/drivers/cloudflare-kv-binding.ts#driver
    - src/drivers/utils/cloudflare.ts#getKVBinding
    - src/drivers/utils/cloudflare.ts#getBinding
    - src/drivers/utils/cloudflare.ts#validateBinding
    - src/drivers/utils/index.ts#createError
  accept_sequences: []
hints:
  - "The missing `put` is caught by a shape check on the binding, not by a failed write, which is why a read can throw too."
  - "`getItem` asks for the binding before it touches the key-value store. Follow that call into `src/drivers/utils/`."
  - "There, note which branch runs for an object binding rather than a string name, and follow it to a loop over required method names. The thrown value comes from a shared helper, not an inline `new Error`."
