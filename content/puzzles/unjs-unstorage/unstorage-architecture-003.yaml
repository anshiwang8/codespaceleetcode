difficulty: easy
title: Registering a new built-in driver
prompt: |
  The `builtinDrivers` map and the `BuiltinDriverName` type in
  src/_drivers.ts list every built-in driver. You add a new driver file,
  src/drivers/foo.ts, and want it to appear there. Select the file whose code
  writes src/_drivers.ts (not src/_drivers.ts itself, and not a file that
  only reads it). Select a file.
answer:
  kind: file
  path: scripts/gen-drivers.ts
  accept: []
  accept_reasons: []
hints:
  - "A map that has to list every file in `src/drivers/` is a natural target for code generation: some code scans that directory and writes TypeScript."
  - "Look outside `src/`. `build.config.ts` imports `builtinDrivers`, but it only reads the map."
  - "Check the `scripts` in `package.json`: the `build` script runs one step before `obuild`, and that step runs a file with `node`."
