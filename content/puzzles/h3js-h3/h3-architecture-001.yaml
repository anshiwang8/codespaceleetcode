id: h3-architecture-001
snapshot: h3js-h3@f0e1780
type: architecture
difficulty: easy
title: Locking the app on serve
prompt: |
  When an app is passed to `serve()`, any later attempt to add a route to that
  app throws an error. In src/, select the file that defines the function which
  installs this restriction on the app (not a file that merely calls it).
  Select a file.
answer:
  kind: file
  path: src/_entries/_common.ts
  accept: []
  accept_reasons: []
hints:
  - "The restriction isn't a check inside the router. It is installed on the app instance when a runtime adapter starts serving it, by replacing the internal method that every route registration goes through."
  - "The per-runtime `serve` functions live in `src/_entries/`, one file per runtime, such as `node.ts`, `bun.ts` and `deno.ts`."
  - "Each runtime entry point's `serve` calls one shared helper before starting the server. Follow that helper's import to the file that defines it."
