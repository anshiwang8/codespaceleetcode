title: Counting characters for maxLength
prompt: |
  The `maxLength` and `minLength` keywords are implemented in
  lib/vocabularies/validation/limitLength.ts. With default options (the `unicode` option is
  not set to false), the generated code does not compare the string's `.length`. Instead it
  calls a helper function at validation time that counts the string's characters. Select
  that helper function, the one that does the counting (not the function that makes it
  available to the generated code). Select a function.
answer:
  kind: symbol
  id: lib/runtime/ucs2length.ts#ucs2length
  accept: []
  accept_reasons: []
hints:
  - "JavaScript's `.length` counts UTF-16 code units, so a character outside the Basic Multilingual Plane counts as two. A correct counter has to treat a surrogate pair as one character."
  - "Generated code reaches runtime helpers through `useFunc` in `lib/compile/util.ts`; the function you want is the one passed to it, not `useFunc` itself."
  - "Look at how the keyword's `code` builds the length expression when `unicode` is not false, and follow the import."
