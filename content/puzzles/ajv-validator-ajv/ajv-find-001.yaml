id: ajv-find-001
snapshot: ajv-validator-ajv@f177fe3
type: find
difficulty: medium
title: Per-type coercion rules
prompt: |
  In lib/compile/validate/, when the `coerceTypes` option is on and a value has
  the wrong type, Ajv generates code that converts it, for example a string
  "false" or the number 0 becoming the boolean false, or a number becoming a
  string. Select the top-level function that contains these per-target-type
  conversion rules, directly or in a nested helper (not the function that merely
  decides whether to coerce and calls it). Select a function.
answer:
  kind: symbol
  id: lib/compile/validate/dataType.ts#coerceData
  accept: []
  accept_reasons: []
hints:
  - "Coercion is decided at compile time: Ajv emits conversion code next to the generated type check, so look where the `coerceTypes` option is read while that check is built."
  - "The conversion rules for each target type are written as a switch over the type name."
  - "Start from `coerceAndCheckDataType`, which only decides whether to coerce, and follow its call. The function it reaches loops over target types and calls a nested helper holding the `switch`; `checkDataType` only tests types."
