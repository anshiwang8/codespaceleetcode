id: ajv-architecture-001
snapshot: ajv-validator-ajv@f177fe3
type: architecture
difficulty: medium
title: Where validation keywords are registered
prompt: |
  The default `Ajv` class (lib/ajv.ts) registers its keywords through
  vocabularies. In lib/vocabularies/, select the one file that registers, in a
  single vocabulary list, the keywords `required`, `pattern`, `enum` and
  `const` together with the other value-validation keywords such as the
  length, item and property count limits. Select a file (the file with that
  list, not a file that implements one keyword's code).
answer:
  kind: file
  path: lib/vocabularies/validation/index.ts
  accept: []
  accept_reasons: []
hints:
  - "Ajv groups keywords into vocabularies, each an array of keyword definitions. Work down from how the class adds its vocabularies instead of starting from one keyword's implementation."
  - "`Ajv._addVocabularies` in `lib/ajv.ts` adds a draft-07 list of vocabularies, whose file in turn imports each vocabulary from its own module."
  - "In `lib/vocabularies/draft7.ts`, follow each array entry to its import, and pick the vocabulary whose list pulls in the keyword modules for `required`, `pattern` and the length and item limits."
