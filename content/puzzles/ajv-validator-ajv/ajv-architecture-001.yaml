title: Where validation keywords are registered
prompt: |
  The default `Ajv` class (lib/ajv.ts) registers its keywords through
  vocabularies. In lib/vocabularies/, select the one file that registers, in a
  single vocabulary list, the keywords `required`, `pattern`, `enum` and
  `const` together with the other value-validation keywords such as the
  length, item and property count limits. Select a file (the file with that
  list, not a file that implements one keyword's code).
