title: From validate to code generation
prompt: |
  Starting at the `validate` method of the `Ajv` class in lib/core.ts, list the
  functions called, in order, until the function exported from
  lib/compile/validate/index.ts that begins generating the validation
  function's code for the root schema is called. List direct calls only (each
  function must be called literally in the body of the previous one), and skip
  standard-library and third-party calls.

  Assume default options, a schema object (not a string key) that has not been
  compiled before and is not a meta-schema. Follow the schema object
  passed to `validate`, and ignore any meta-schema validation along the way. Include the start function in your
  sequence.
answer:
  kind: sequence
  ids:
    - lib/core.ts#Ajv.validate
    - lib/core.ts#Ajv.compile
    - lib/core.ts#Ajv._compileSchemaEnv
    - lib/compile/index.ts#compileSchema
    - lib/compile/validate/index.ts#validateFunctionCode
  accept_sequences: []
hints:
  - "Ajv compiles before it validates: `validate` needs a validation function for the schema first, so follow the path that builds one for a schema it has never seen."
  - "The schema-object branch of `validate` calls a public method on the same class that turns a schema into a validation function; `getSchema` belongs to the string-key branch."
  - "At each step, skip calls that only register or look up the schema, such as `_addSchema`, and follow the one that compiles; where the code branches on `sch.meta`, take the non-meta path out of `lib/core.ts`."
validator_overrides:
  - check: sequence-alternate-path
    reason: The equal-length alternate paths all go through Ajv.getSchema, which is the branch of validate taken only when the first argument is a string key. The prompt fixes the runtime path to a schema object, so that branch is not taken.
