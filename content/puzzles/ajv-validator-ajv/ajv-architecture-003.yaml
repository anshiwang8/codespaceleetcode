id: ajv-architecture-003
snapshot: ajv-validator-ajv@f177fe3
type: architecture
difficulty: medium
title: Compiling the same schema twice
prompt: |
  An `Ajv` instance is created with default options. The same schema object
  (one reference, with no `$id`) is passed to `ajv.compile(schema)` twice in a
  row. Following `compile` and `_addSchema` in lib/core.ts, what happens on the
  second call? Select one option.
answer:
  kind: choice
  option: d
choices:
  - id: a
    label: compileSchema runs again, producing a second, separate validation function.
  - id: b
    label: compileSchema does not run again, but the second call wraps the cached function in a new function before returning it.
  - id: c
    label: The second call throws because a schema with that key already exists.
  - id: d
    label: compileSchema does not run again; the second call returns the validation function stored on the cached schema entry from the first call.
hints:
  - "This is a caching question: work out what Ajv uses as the cache key for a schema with no `$id`, and what it keeps under that key."
  - "In `lib/core.ts`, find the private `_cache` map on the class: note its key type and the kind of object it stores, then see where `_addSchema` reads and writes it."
  - "Look at what `_addSchema` returns when its cache already holds the schema, and what `compile` does with `sch.validate`."
